<!DOCTYPE html>
<html lang="en">
    <head>
        <title>BoulderBud Sign Up</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Bootstrap 5 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
        <!-- Favicon -->
        <link rel="icon" type="image/png" href="./src/assets/bb_monke.png"/>
        <link rel="stylesheet" href="./src/styles.css"/>
        <!-- Reusable footer -->
        <script src="./footer.js" type="text/javascript" defer></script>
        <!-- Reusable left portion of the header-->
        <script src="./header-ls.js" type="text/javascript" defer></script>
        <!-- FontAwesome Icons -->
        <script src="https://kit.fontawesome.com/1123bfab37.js" crossorigin="anonymous"></script>
        <!-- Google Identity Services -->
        <script src="https://accounts.google.com/gsi/client" async></script>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Honk&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Contrail+One&display=swap" rel="stylesheet">
    </head>
    <body class="bg">
        <!-- Header -->
        <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3 " id="header">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <header-left-side></header-left-side>
            </div>
        </nav>
        <div class="container-fluid" id="main_content_area">
            <div class="row">
                <div class="row align-items-center" id="background-panel1">
                    <div class="col col-4 offset-4 pt-4 mt-3 mb-5 order-2">
                        <h2 id="lightText">Create an Account</h2>
                        <form id="signupForm" class="form-control py-3 px-4">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" style="padding-right: 40px;" required>
                                <i id="icon" class="fa-solid fa-eye" style="right: 37vw; transform: translateY(-140%);"></i>
                            </div>
                            <div class="d-grid gap-1 col-4 mx-auto pt-3">
                                <button type="submit" class="btn btn-primary" >Sign Up</button>
                            </div>
                        </form>
                        <div class="row">
                            <div class="col-10 offset-1 mt-3">
                                <p id="auth-feedback"></p>
                            </div>
                        </div>
                        <br/>
                        <h2 id="lightText">- OR -</h2>
                        <!-- Google Sign-Up Button -->
                        <div class="row justify-content-center">
                            <input id="googleSigninBtn" type="image" src="./src/assets/google_signin.png">
                        </div>
                        <a id="donthave-have_link" href="./login.html">Already have an account? Log In</a>
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer -->
        <footer-component></footer-component>
        <!-- Script checking for authenticated user -->
        <script type="module">
                import { auth, db } from './src/firebase.js';
                import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
                const i = 0;
                auth.onAuthStateChanged(user => {
                    if (user && i===0) {
                        // User is signed in
                        window.location.href = "./profile.html";
                    } 
                    i++;
                });
        </script>
        </script>
        <script type="module">
            import { auth, db } from './src/firebase.js';
            import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
            import { doc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

            document.querySelector("form").addEventListener("submit", async (e) => {
                e.preventDefault(); //Stop form from traditional submission
                const formData = new FormData(e.target);
                const email = formData.get("email");
                const password = formData.get("password");
                if(password.length < 6){
                    document.getElementById("feedback").textContent = "Password must be at least 6 characters long.";
                    document.getElementById("feedback").style.backgroundColor = "coral";
                } else {
                    //Use Firebase Authentication with Email and Password to create user
                    try {
                        const userCred = await createUserWithEmailAndPassword(auth, email, password);
                        //add a new document to collection users:
                        await setDoc(doc(db, "users", userCred.user.uid ), {
                            uid: userCred.user.uid,
                            uploads_left_today: 10
                        }); 
                    } catch (err) {
                        document.getElementById("feedback").textContent = "Error creating user. Please try again.";
                        document.getElementById("feedback").style.backgroundColor = "coral";
                    }
                    //clean up form
                    document.querySelector("form").reset();
                    document.getElementById("feedback").textContent = "Welcome aboard!";
                    document.getElementById("feedback").style.backgroundColor = "lightgreen";
                    setTimeout(() => {
                        window.location.href = "./profile.html";
                    }, 1500);
                }
            });
        </script>
        <script type="module">
            import { auth, db } from './src/firebase.js';
            import { getRedirectResult, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
            import { doc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

            const provider = new GoogleAuthProvider();
            const googleSigninButton = document.getElementById("googleSigninBtn");

            googleSigninButton.addEventListener("click",(e) => {
                e.preventDefault();
                signInWithPopup(auth, provider)
                .then(async (result) => {
                    try{
                        //add a new document to collection users:
                        await setDoc(doc(db, "users", result.user.uid ), {
                            uid: result.user.uid,
                            uploads_left_today: 10
                        });
                    } catch (err){
                        console.error("Error adding document: ", err);
                    }
                    setTimeout(() => {
                        window.location.href = "./profile.html";
                    }, 1000);
                })
                .catch((error) => {
                    console.error(error);
                });
            });
        </script>
        <script>
            const passwordInput = document.getElementById("password");
            const revealPasswordIcon = document.getElementById("icon");

            revealPasswordIcon.addEventListener("click", () => {
                const newType = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                passwordInput.setAttribute("type", newType);
                //Swap icon:
                if(newType === "text"){
                    document.getElementById("icon").classList.remove("fa-eye");
                    document.getElementById("icon").classList.add("fa-eye-slash");
                } else {
                    document.getElementById("icon").classList.remove("fa-eye-slash");
                    document.getElementById("icon").classList.add("fa-eye");
                }
            });
        </script>
    </body>

    
</html>
