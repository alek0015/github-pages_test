    <!-- Script checking for authenticated user -->
        <script type="module">
            import { auth, db } from './src/firebase.js';
            import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
            import { doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

            const changeEmailButton = document.getElementById('change-email-button');

            onAuthStateChanged( auth, async (user) => {
                if (user){ //i.e. user is logged in
                    console.log("Current user:", user);
                    if(user.providerData[0].providerId === 'google.com'){
                        document.querySelectorAll('.pw_provider').forEach( el => el.style.display = 'none');
                        changeEmailButton.innerText = "";
                    } else {
                        document.querySelectorAll('.pw_provider').forEach( el => el.style.display = 'block');
                        changeEmailButton.innerText = "Change email";
                    }
                    document.getElementById("user-email").innerText = user.email;
                    document.getElementById("email-display").innerText = user.email;
                    if(user.photoURL){ //if user has a profile picture, display it
                        document.getElementById("user-profile-button").src = user.photoURL;
                    }
                    //Get number of attempts remaining for the user:
                    const userRef = doc(db, "users", user.uid);
                    const docSnap = await getDoc(userRef);
                    console.log(docSnap);
                    if (docSnap.exists()){
                        const data = docSnap.data();
                        console.log(data);
                        document.getElementById("numUploadsLeft").innerText = data.uploads_left_today;
                        document.getElementById("uploads-limit-progress").value = data.uploads_left_today;
                    }
                } else {
                    window.location.href = "./index.html";
                }
            });
        </script>
        <script type="module">
            import {auth} from './src/firebase.js';
            import {verifyBeforeUpdateEmail, reauthenticateWithCredential, EmailAuthProvider} from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

            const emailForm = document.getElementById('change-email-form');
            const emailFormSubmitButton = document.getElementById('submit-new-email-button');
            const emailFormFeedback = document.getElementById('email-form-feedback');
            const authenticationModal = document.getElementById('reauth-modal');
            const authForm = document.getElementById('reauth-form');
            const authModalFeedback = document.getElementById('reauth-modal-feedback');


            emailFormSubmitButton.addEventListener('click', async (e) => {
                e.preventDefault();
                const formData = new FormData(emailForm);
                const updatedEmail = formData.get("email");
                const user = auth.currentUser;

                try {
                    //Try to update email
                    await verifyBeforeUpdateEmail(user, updatedEmail);
                    emailFormFeedback.textContent = "Check your new email for a confirmation link.";
                    emailFormFeedback.style.backgroundColor = "lightgreen";
                    emailForm.reset(); 
                    setTimeout(() => {
                        //Hide form
                        emailForm.style.display = "none";
                    }, 1000);
                } catch (err){
                    console.error("Email update error:", err);
                    //Session too old, reauthenticate:
                    if (err.code == 'auth/requires-recent-login') {
                        try{
                            //Re-authenticate user in case session is considered old:
                            const renewedCredential = await promptForCredentials();
                            await reauthenticateWithCredential(user, renewedCredential);
                            console.log("Reauthentication successful")
                
                            //Retry email update
                            await verifyBeforeUpdateEmail(user, updatedEmail);
                            emailFormFeedback.textContent = "Check your new email for a confirmation link.";
                            emailFormFeedback.style.backgroundColor = "lightgreen";
                            emailForm.reset();
                            setTimeout(() => {
                                //Hide form
                                emailForm.style.display = "none";
                            }, 1000);
                        } catch (reauthErr){
                            console.error("Reauthentication failed:", reauthErr);
                            emailFormFeedback.textContent = "Reauthentication failed. Try logging in again.";
                            emailFormFeedback.style.backgroundColor = "coral";
                            return 
                        }
                    } else {
                        emailFormFeedback.textContent = "Error updating email. Please retry.";
                        emailFormFeedback.style.backgroundColor = "coral";
                    }
                }
            });

            //Prompt for credentials using modal in profile.html
            function promptForCredentials(){
                return new Promise((resolve, reject) => {
                    authenticationModal.style.display = "flex";

                    //Handle modal submit
                    const  handleSubmit = async (e) => {
                        e.preventDefault();
                        const authFormData = new FormData(authForm);
                        const email = authFormData.get("email");
                        const password = authFormData.get("password");
                        try {
                            const credential = EmailAuthProvider.credential(email, password);
                            //clean up and hide form
                            authForm.reset();
                            authModalFeedback.textContent = "Authentication successful.";
                            authModalFeedback.style.backgroundColor = "lightgreen";
                            setTimeout(() => {
                                authenticationModal.style.display = "none";
                            }, 500);

                            authForm.removeEventListener('submit', handleSubmit);

                            resolve(credential);
                        } catch (err) {
                            authModalFeedback.textContent = "Email or password incorrect. Please try again.";
                            authModalFeedback.style.backgroundColor = "coral";
                            reject(err);
                        }
                    }

                    authForm.addEventListener('submit', handleSubmit);
                });
            }
        </script>
        <script type="module">
            import {auth} from './src/firebase.js';
            import {updatePassword} from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

            const changePasswordForm = document.getElementById('change-password-form');
            const changePasswordFormSubmitButton = document.getElementById('submit-new-password-button');
            const changePasswordFormFeedback = document.getElementById('password-form-feedback');

            changePasswordFormSubmitButton.addEventListener('click', async (e) => {
                e.preventDefault();
                const formData = new FormData(changePasswordForm);
                const newPassword = formData.get("password1");
                const newPasswordRepeat = formData.get("password2");

                if(newPassword !== newPasswordRepeat){
                    changePasswordFormFeedback.textContent = "Passwords do not match.";
                    changePasswordFormFeedback.style.backgroundColor = "coral";
                } else {
                    try {
                        updatePassword(auth.currentUser, newPassword);
                        changePasswordForm.reset(); 
                        changePasswordFormFeedback.textContent = "Password update successful.";
                        changePasswordFormFeedback.style.backgroundColor = "lightgreen";
                        setTimeout(() => {
                            //Hide form
                            changePasswordForm.style.display = "none";
                            window.location.reload();
                        }, 1000);
                    } catch (err){
                        console.error("Password update error:", err);
                        changePasswordFormFeedback.textContent = "Error updating password";
                        changePasswordFormFeedback.style.backgroundColor = "coral";
                    }
                }
            });
        </script>
        <script type="module">
            import { auth } from './src/firebase.js';
            import { signOut } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

            document.getElementById("logout-button").addEventListener("click", async (e) => {
                e.preventDefault();
                try {
                    await signOut(auth);
                    console.log("User signed out;");
                    setTimeout(() => {
                        window.location.href = "./index.html";
                    }, 500);
                } catch (err) {
                    console.error("Error signing out: ", err.message);
                }
            });
        </script>
        <script type="module">
            import {auth} from './src/firebase.js';
            import {deleteUser, reauthenticateWithCredential, EmailAuthProvider} from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

            const deleteAccButton = document.getElementById('delete-account-button'); 
            const deleteAccFeedback = document.getElementById('delete-acc-action-feedback');

            deleteAccButton.addEventListener('click', async (e) => {
                e.preventDefault();
                const user = auth.currentUser;

                try {
                    //Try to update email
                    await deleteUser(user);
                    deleteAccFeedback.textContent = "Sorry to see you go. Redirecting to starting page";
                    deleteAccFeedback.style.backgroundColor = "lightgreen";
                    setTimeout(() => {
                        window.location.href = "./index.html";
                    }, 1500);
                } catch (err){
                    console.error("Delete error:", err);
                    //Session too old, reauthenticate:
                    if (err.code == 'auth/requires-recent-login') {
                        try{
                            //Re-authenticate user in case session is considered old:
                            const renewedCredential = await promptForCredentials();
                            await reauthenticateWithCredential(user, renewedCredential);
                            console.log("Reauthentication successful")
                
                            //Retry email update
                            await deleteUser(user);
                            deleteAccFeedback.textContent = "Sorry to see you go. Redirecting to starting page";
                            deleteAccFeedback.style.backgroundColor = "lightgreen";
                            setTimeout(() => {
                                window.location.href = "./index.html";
                            }, 1500);
                        } catch (reauthErr){
                            console.error("Reauthentication failed:", reauthErr);
                            deleteAccFeedback.textContent = "Reauthentication failed. Try logging in again.";
                            deleteAccFeedback.style.backgroundColor = "coral";
                            return 
                        }
                    } else {
                        deleteAccFeedback.textContent = "Error deleting account. Please try again.";
                        deleteAccFeedback.style.backgroundColor = "coral";
                    }
                }
            });

            //Prompt for credentials using modal in profile.html
            function promptForCredentials(){
                return new Promise((resolve, reject) => {
                    authenticationModal.style.display = "flex";

                    //Handle modal submit
                    const  handleSubmit = async (e) => {
                        e.preventDefault();
                        const authFormData = new FormData(authForm);
                        const email = authFormData.get("email");
                        const password = authFormData.get("password");
                        try {
                            const credential = EmailAuthProvider.credential(email, password);
                            //clean up and hide form
                            authForm.reset();
                            authModalFeedback.textContent = "Authentication successful.";
                            authModalFeedback.style.backgroundColor = "lightgreen";
                            setTimeout(() => {
                                authenticationModal.style.display = "none";
                            }, 500);

                            authForm.removeEventListener('submit', handleSubmit);

                            resolve(credential);
                        } catch (err) {
                            authModalFeedback.textContent = "Email or password incorrect. Please try again.";
                            authModalFeedback.style.backgroundColor = "coral";
                            reject(err);
                        }
                    }

                    authForm.addEventListener('submit', handleSubmit);
                });
            }
        </script>
        <script>
            document.getElementById('change-email-button').addEventListener('click', (e) => {
                e.preventDefault();
                //Toggle visibility of email change form
                if(document.getElementById('change-email-form').style.display === "none"){
                    document.getElementById('change-email-form').style.display = "block";
                }
            });

            const changePasswordButton = document.getElementById('change-password-button');
            changePasswordButton.addEventListener('click', (e) => {
                e.preventDefault();
                //Toggle visibility of email change form
                if(document.getElementById('change-password-form').style.display === "none"){
                    document.getElementById('change-password-form').style.display = "block";
                }
            })

            const passwordInput = document.getElementById("auth-password");
            const revealPasswordIcon = document.getElementById("icon");
            const showPasswordIcon = document.getElementById("icon");

            revealPasswordIcon.addEventListener("click", () => {
                const newType = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                passwordInput.setAttribute("type", newType);
                //Swap icon:
                if(newType === "text"){
                    showPasswordIcon.classList.remove("fa-eye");
                    showPasswordIcon.classList.add("fa-eye-slash");
                } else {
                    showPasswordIcon.classList.remove("fa-eye-slash");
                    showPasswordIcon.classList.add("fa-eye");
                }
            });
        </script>
        <script>
            function openTab(e, tabName) {
                var i, tabcontent, tablinks;
                tabcontent = document.getElementsByClassName("tabcontent");
                for (i = 0; i < tabcontent.length; i++) {
                    tabcontent[i].style.display = "none";
                }
                tablinks = document.getElementsByClassName("tablinks");
                for (i = 0; i < tablinks.length; i++) {
                    tablinks[i].className = tablinks[i].className.replace(" active", "");
                }
                document.getElementById(tabName).style.display = "block";
                e.currentTarget.className += " active";
            }
            document.body.addEventListener(DOMContentLoaded, openTab(event, 'feedback-history'));

            var span = document.getElementsByClassName("close")[0];
            span.onclick = function() { // Close the modal when the user clicks on <span> (x)
                document.getElementById('reauth-modal').style.display = "none";
            }
        </script>
